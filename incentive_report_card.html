<style>
:root{--bg:#F6F7F8;--ink:#1D2328;--muted:#5B6670;--line:#D5DBE0;--accent:#1F7A70;--card:#FFFFFF;--bad:#B3261E}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:380px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 6px} p{color:var(--muted);margin:0 0 16px}
label{display:block;font-size:14px;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#msg{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
</style>
